<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Swan House Farm — Farm Dinners</title>
<meta property="og:title" content="Swan House Farm — Farm Dinners">
<meta property="og:description" content="Your evening at the farm: menu, wine pairings, and everything to know before you arrive.">
<style>
:root {
  --bg:           #f4ede0;
  --bg-deeper:    #ece2cc;
  --card:         #fbf6ea;
  --card-edge:    #d8c8a8;
  --border:       #d8c8a8;
  --border-soft:  #e6d8b8;
  --text:         #2a2418;
  --text-soft:    #6a5e48;
  --text-mute:    #a89a78;
  --accent:       #4a6a3a;
  --accent-dark:  #2e4624;
  --accent-soft:  #c8d6b8;
  --rust:         #b04a1a;
  --rust-soft:    #f4dec8;
  --gold:         #a8842c;
  --gold-soft:    #f0e4c4;
  --wood:         #5a3a22;
  --wood-soft:    #8a6a4a;
  --shadow:       0 1px 2px rgba(58, 42, 22, 0.06);
  --shadow-lift:  0 2px 6px rgba(58, 42, 22, 0.12);
  --radius:       6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Caladea', 'Cambria', Georgia, serif;
  color: var(--text);
  background-color: var(--bg);
  background-image:
    linear-gradient(rgba(244, 237, 224, 0.52), rgba(244, 237, 224, 0.62)),
    url('../dinner-hero.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 100vh;
}
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }

.bubble {
  background: rgba(251, 246, 234, 0.95);
  max-width: 720px;
  margin: 18px auto 24px;
  border-radius: 14px;
  padding: 26px 22px 34px;
  box-shadow:
    0 6px 22px rgba(58, 42, 22, 0.28),
    0 0 0 1px rgba(216, 200, 168, 0.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
@media (max-width: 760px) { .bubble { margin: 10px 10px 18px; padding: 22px 16px 28px; } }

/* ---------- header ---------- */
.hdr { text-align: center; margin-bottom: 26px; }
.hdr-eyebrow {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--gold); margin-bottom: 8px;
}
.hdr-title { font-size: 30px; font-weight: 700; color: var(--wood); line-height: 1.15; }
.hdr-sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 13.5px; color: var(--text-mute); margin-top: 8px;
}
.hdr-dates {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px;
}
.hdr-date {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 12px; font-weight: 600; color: var(--wood);
  background: var(--gold-soft); border: 1px solid var(--gold);
  border-radius: 999px; padding: 4px 13px;
}

/* ---------- sections ---------- */
.section { margin: 0 0 30px; }
.section-label {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.12em; color: var(--gold);
  margin: 0 0 12px; padding-bottom: 6px;
  border-bottom: 0.5px solid var(--border);
}
.prose { font-size: 14.5px; line-height: 1.6; color: var(--text); }
.prose + .prose { margin-top: 10px; }
.prose em { color: var(--text-soft); }

/* ---------- evening timeline ---------- */
.evening { display: flex; flex-direction: column; gap: 0; }
.ev-step { display: flex; gap: 14px; }
.ev-rail { display: flex; flex-direction: column; align-items: center; width: 14px; flex-shrink: 0; }
.ev-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--gold); margin-top: 6px; flex-shrink: 0;
  box-shadow: 0 0 0 3px var(--gold-soft);
}
.ev-line { width: 1px; flex: 1; background: var(--border); margin: 4px 0 2px; }
.ev-step:last-child .ev-line { display: none; }
.ev-body { padding-bottom: 18px; }
.ev-time {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--gold);
}
.ev-name { font-size: 16px; font-weight: 700; color: var(--wood); margin: 2px 0 3px; }
.ev-desc { font-size: 13.5px; line-height: 1.5; color: var(--text-soft); }

/* ---------- course + dish cards ---------- */
.course { margin: 0 0 22px; }
.course-label { font-size: 22px; font-weight: 500; color: var(--wood); text-align: center; }
.course-sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 12px; font-style: italic; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-mute); text-align: center; margin: 2px 0 12px;
}
.dish, .wine, .cocktail {
  background: var(--bg);
  border: 0.5px solid var(--border);
  border-radius: 8px;
  margin: 0 0 10px;
  overflow: hidden;
  transition: border-color 0.15s ease;
}
.dish.expanded, .wine.expanded, .cocktail.expanded { border-color: var(--gold); }
.dish-head, .wine-head, .cocktail-head { padding: 14px 16px; cursor: pointer; user-select: none; }
.dish-details, .wine-details, .cocktail-details {
  display: none; padding: 4px 18px 18px; border-top: 0.5px dashed var(--border);
}
.dish.expanded .dish-details, .wine.expanded .wine-details, .cocktail.expanded .cocktail-details { display: block; }

.dish-name { font-size: 16.5px; font-weight: 700; color: var(--wood); text-align: center; }
.dish-pron { font-size: 13px; font-style: italic; font-weight: 400; color: var(--gold); }
.dish-comp { font-size: 14px; font-style: italic; color: var(--text-mute); text-align: center; margin-top: 4px; }
.dish-story { font-size: 14.5px; line-height: 1.55; color: var(--text); margin-top: 10px; }
.ing-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--gold); margin: 14px 0 6px;
}
.ing { font-size: 13.5px; line-height: 1.5; margin: 0 0 6px; }
.ing-bullet { color: var(--gold); margin-right: 5px; }
.ing-term { font-weight: 700; color: var(--wood); }
.ing-pron { font-style: italic; color: var(--gold); }
.tap-hint {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; color: var(--text-mute); text-align: center; margin: 0 0 12px;
}

/* ---------- wine cards ---------- */
.wine-pills { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; flex-wrap: wrap; }
.wine-type {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 10.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; border-radius: 999px; padding: 3px 10px;
}
.wine-type-white     { background: #f5ead0; color: var(--wood); }
.wine-type-red       { background: #e8d4cc; color: #6b2818; }
.wine-type-sparkling { background: #e8e8d4; color: #5f5a2a; }
.wine-type-na        { background: #e0e8de; color: #3a5a3a; }
.wine-name { font-size: 16.5px; font-weight: 700; color: var(--wood); }
.wine-vint { font-size: 13px; font-style: italic; font-weight: 400; color: var(--gold); }
.wine-sub {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 12.5px; color: var(--text-mute); margin: 2px 0 8px;
}
.wine-notes { font-size: 14px; line-height: 1.5; color: var(--text); }
.wine-specs {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  margin-top: 12px; padding-top: 10px; border-top: 0.5px dashed var(--border);
}
.wine-spec { text-align: center; }
.wine-spec-label {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-mute); margin-bottom: 3px;
}
.wine-dots { display: inline-flex; gap: 3px; align-items: center; }
.wine-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
.wine-dot.on { background: var(--gold); }
.wine-spec-range {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 9.5px; color: var(--text-mute); margin-top: 2px;
}
.detail-label {
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--gold); margin: 14px 0 5px;
}
.detail-body { font-size: 14px; line-height: 1.55; color: var(--text); }
.held-note {
  background: var(--bg); border: 0.5px dashed var(--border);
  border-radius: 8px; padding: 14px 16px;
  font-size: 13.5px; line-height: 1.55; color: var(--text-soft); font-style: italic;
}

/* ---------- cocktail ---------- */
.cocktail-tag { font-size: 13px; font-style: italic; color: var(--gold); margin: 2px 0 8px; }
.cocktail-ing { padding: 9px 0; border-bottom: 0.5px dashed var(--border-soft); }
.cocktail-ing:last-child { border-bottom: none; }
.cocktail-ing.has-highlight {
  border-left: 3px solid var(--accent);
  padding-left: 10px; margin-left: -10px;
  background: linear-gradient(to right, rgba(200, 214, 184, 0.18), transparent 60%);
  border-radius: 4px;
}
.ci-row { display: flex; align-items: baseline; gap: 8px; }
.ci-name { font-size: 14px; font-weight: 700; color: var(--wood); }
.ci-amount {
  margin-left: auto;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 12px; color: var(--text-mute); white-space: nowrap;
}
.ci-highlight {
  display: inline-block; padding: 2px 9px;
  background: var(--accent-soft); border: 1px solid var(--accent);
  color: var(--accent-dark); border-radius: 999px;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; line-height: 1.3; white-space: nowrap;
}
.ci-desc { font-size: 13.5px; line-height: 1.5; color: var(--text); margin-top: 6px; }

/* ---------- getting here / info cards ---------- */
.info-card {
  background: var(--bg); border-radius: 8px;
  padding: 12px 14px; margin: 0 0 10px;
  border-left: 3px solid var(--gold);
}
.info-card.pending { border-left-color: var(--text-mute); }
.info-title { font-size: 14.5px; font-weight: 700; color: var(--wood); margin-bottom: 3px; }
.info-body { font-size: 13.5px; line-height: 1.55; color: var(--text); white-space: pre-line; }
.info-body a { color: var(--accent-dark); }
.route-note {
  background: var(--rust-soft); border-left: 3px solid var(--rust);
  border-radius: 8px; padding: 12px 14px; margin: 0 0 10px;
  font-size: 13.5px; line-height: 1.55; color: var(--text);
}
.map-wrap {
  border: 0.5px solid var(--border); border-radius: 8px;
  overflow: hidden; background: var(--card); margin: 0 0 10px;
}
.map-wrap img { display: block; width: 100%; height: auto; }
.map-caption {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; color: var(--text-mute); text-align: center;
  padding: 8px 10px 10px;
}
.faq-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .faq-grid { grid-template-columns: 1fr; } }
.faq-card {
  background: var(--bg); border: 0.5px solid var(--border);
  border-radius: 8px; padding: 12px 14px;
}
.faq-q { font-size: 13.5px; font-weight: 700; color: var(--wood); margin-bottom: 4px; }
.faq-a { font-size: 13px; line-height: 1.5; color: var(--text-soft); }

.dietary {
  background: var(--gold-soft); border-left: 3px solid var(--gold);
  border-radius: 8px; padding: 14px 16px;
  font-size: 14px; line-height: 1.6; color: var(--text);
}

.footer { text-align: center; margin-top: 34px; }
.footer-tagline {
  font-size: 13.5px; font-style: italic; color: var(--text-soft);
  max-width: 440px; margin: 0 auto 14px; line-height: 1.6;
}
.footer-fine {
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; color: var(--text-mute);
}
.footer-fine a { color: var(--text-mute); }
.footer-past { margin: 8px auto 18px; line-height: 1.5; }
.footer-past .eyebrow { text-transform: uppercase; letter-spacing: 0.14em; font-size: 10px; color: var(--text-mute); }
.footer-past .links { margin-top: 7px; font-size: 14px; font-style: italic; color: var(--text-soft); }
.footer-past a { color: var(--gold); text-decoration: none; }
.footer-past a:hover { text-decoration: underline; }
.footer-past .sep { color: var(--text-mute); margin: 0 9px; font-style: normal; }

/* ---------- edit mode ---------- */
.edit-bar {
  display: none; position: sticky; top: 0; z-index: 50;
  background: var(--wood); color: #fff; border-radius: 8px;
  padding: 10px 14px; margin-bottom: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 13px;
}
body.editing .edit-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.edit-bar button {
  font-family: inherit; font-size: 12.5px; font-weight: 700;
  border: none; border-radius: 999px; padding: 7px 16px; cursor: pointer;
}
.edit-save { background: var(--gold); color: #fff; }
.edit-cancel { background: rgba(255,255,255,0.18); color: #fff; }
.edit-status { font-size: 12px; opacity: 0.85; }
.editable-field { display: none; width: 100%; margin-top: 8px; }
body.editing .editable-field { display: block; }
.editable-field label {
  display: block; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--gold); margin-bottom: 4px;
}
.editable-field textarea, .editable-field input {
  width: 100%; font-family: 'Caladea', 'Cambria', Georgia, serif;
  font-size: 14px; color: var(--text); background: #fff;
  border: 1px solid var(--gold); border-radius: 6px; padding: 8px 10px;
}
.editable-field textarea { min-height: 84px; resize: vertical; }
</style>
</head>

const DATES = [
  { date: "2026-07-11", display: "Sat, July 11" },
  { date: "2026-07-12", display: "Sun, July 12" },
  { date: "2026-07-18", display: "Sat, July 18" },
  { date: "2026-07-19", display: "Sun, July 19" }
];

/* ============================================================ RENDER */
let guestInfo = { ...GUEST_INFO_DEFAULTS };
const expanded = new Set();
const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function renderDates() {
  document.getElementById("hdr-dates").innerHTML =
    DATES.map(d => `<span class="hdr-date">${esc(d.display)}</span>`).join("");
}

function dishHTML(d, idx) {
  const key = "d" + idx;
  const pron = d.pronunciation ? ` <span class="dish-pron">${esc(d.pronunciation)}</span>` : "";
  const comp = d.components ? `<div class="dish-comp">${esc(d.components)}</div>` : "";
  const ings = (d.ingredients || []).map(i =>
    `<div class="ing"><span class="ing-bullet">·</span><span class="ing-term">${esc(i.term)}</span>${i.pronunciation ? ` <span class="ing-pron">${esc(i.pronunciation)}</span>` : ""} — ${esc(i.note)}</div>`).join("");
  return `<div class="dish ${expanded.has(key) ? "expanded" : ""}" data-key="${key}">
    <div class="dish-head" onclick="toggle('${key}')">
      <div class="dish-name">${esc(d.name)}${pron}</div>${comp}
    </div>
    <div class="dish-details">
      <div class="dish-story">${esc(d.story)}</div>
      ${ings ? `<div class="ing-label">Ingredients to know</div>${ings}` : ""}
    </div>
  </div>`;
}

function renderMenu() {
  let i = 0;
  document.getElementById("menu").innerHTML = REF.courses.map(c => `
    <div class="course">
      <div class="course-label">${esc(c.label)}</div>
      <div class="course-sub">${esc(c.subtitle)}</div>
      ${c.dishes.map(d => dishHTML(d, i++)).join("")}
    </div>`).join("");
}

function typePill(t) {
  const cls = t === "red" ? "wine-type-red" : t.includes("sparkling") ? "wine-type-sparkling" : t.includes("NA") ? "wine-type-na" : "wine-type-white";
  return `<span class="wine-type ${cls}">${esc(t)}</span>`;
}

function wineHTML(w, idx) {
  const key = "w" + idx;
  const na = w.alcohol_pct === 0 ? `<span class="wine-type wine-type-na">NA · 0%</span>` : "";
  const specs = (w.specs || []).map(s => `
    <div class="wine-spec">
      <div class="wine-spec-label">${esc(s.label)}</div>
      <div class="wine-dots">${[1,2,3,4,5].map(n => `<span class="wine-dot ${n <= s.rating ? "on" : ""}"></span>`).join("")}</div>
      <div class="wine-spec-range">${esc(s.lands || (s.low + ' · ' + s.high))}</div>
    </div>`).join("");
  return `<div class="wine ${expanded.has(key) ? "expanded" : ""}" data-key="${key}">
    <div class="wine-head" onclick="toggle('${key}')">
      <div class="wine-pills">${typePill(w.type)}${na}</div>
      <div class="wine-name">${esc(w.name)}${w.vintage ? `&nbsp;<span class="wine-vint">${esc(w.vintage)}</span>` : ""}</div>
      <div class="wine-sub">${esc(w.region)} · ${esc(w.grapes)}</div>
      <div class="wine-notes">${esc(w.pour_notes)}</div>
      <div class="wine-specs">${specs}</div>
    </div>
    <div class="wine-details">
      <div class="detail-label">Producer</div><div class="detail-body">${esc(w.producer)}</div>
      <div class="detail-label">Winemaking</div><div class="detail-body">${esc(w.winemaking)}</div>
    </div>
  </div>`;
}

function renderWines() {
  const el = document.getElementById("wines");
  const hint = document.getElementById("wine-hint");
  if (!REF.wines || !REF.wines.length) {
    if (hint) hint.style.display = "none";
    el.innerHTML = `<div class="held-note">Our pairings for this dinner are being finalized with the team. They'll appear right here before your evening at the farm.</div>`;
    return;
  }
  if (hint) hint.style.display = "";
  el.innerHTML = REF.wines.map((w, i) => wineHTML(w, i)).join("");
}

function cocktailHTML(c, idx) {
  const key = "c" + idx;
  const ings = (c.ingredients || []).map((i, n) => {
    const ikey = key + "i" + n;
    return `<div class="cocktail-ing ${i.highlight ? "has-highlight" : ""}">
      <div class="ci-row" onclick="toggle('${ikey}'); event.stopPropagation();" style="cursor:pointer;">
        <span class="ci-name">${esc(i.name)}</span>
        ${i.highlight ? `<span class="ci-highlight">${esc(i.highlight)}</span>` : ""}
        <span class="ci-amount">${esc(i.amount)}</span>
      </div>
      <div class="ci-desc" style="display:${expanded.has(ikey) ? "block" : "none"};">${esc(i.description)}</div>
    </div>`;
  }).join("");
  return `<div class="cocktail ${expanded.has(key) ? "expanded" : ""}" data-key="${key}">
    <div class="cocktail-head" onclick="toggle('${key}')">
      <div class="wine-pills"><span class="wine-type wine-type-white">cocktail</span></div>
      <div class="wine-name">${esc(c.name)}</div>
      <div class="cocktail-tag">${esc(c.tagline)}</div>
      <div class="wine-notes">${esc(c.pour_notes)}</div>
    </div>
    <div class="cocktail-details">
      <div class="detail-label">What's in it · tap each for more</div>
      ${ings}
    </div>
  </div>`;
}

function renderCocktails() {
  const sec = document.getElementById("bar-section");
  if (!REF.cocktails || !REF.cocktails.length) {
    // Bar is pending Katie — hide the section entirely until a cocktail lands.
    if (sec) sec.style.display = "none";
    return;
  }
  if (sec) sec.style.display = "";
  document.getElementById("cocktails").innerHTML = REF.cocktails.map((c, i) => cocktailHTML(c, i)).join("");
}

function toggle(key) {
  expanded.has(key) ? expanded.delete(key) : expanded.add(key);
  renderMenu(); renderWines(); renderCocktails();
}

function renderGuestInfo() {
  /* Archive: the parking, route-note and host-note cards are gone, so all that survives of
     this function is the footer tagline. Kept as a function rather than inlined so the INIT
     line below still reads the same as the live portal's. */
  const ft = document.getElementById("footer-tagline");
  if (ft) ft.textContent = REF.header.tagline;
}

/* ============================================================ INIT */
renderDates(); renderMenu(); renderWines(); renderCocktails(); renderGuestInfo();
